<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>강의</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* =====================================================================
   디자인 토큰 (Solarix 분위기 참고: 크림 바탕, 라임 형광펜, 검은 대비 패널)
   라임은 형광펜처럼만 쓴다(지금 단계, 정답, 핵심 단어). 라임 위 글씨는 항상 --ink.
   ===================================================================== */
:root{
  --bg:#F7F4EA; --card:#FDFCF7; --ink:#14161B; --sub:#6C7078; --mute:#6C7078;
  --lime:#DCF56E; --panel:#14161B; --panel-sub:#8C8F98; --rest:#E7E5DC;
  --line:rgba(20,22,27,.08);
  --r:20px; --max:1120px;
  --font:"Instrument Sans","Pretendard Variable",Pretendard,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"Cascadia Code","D2Coding",Consolas,monospace;
  /* 모션 토큰: 모든 전환은 이 값만 쓴다 (INTERACTIONS.md 2장) */
  --t-press:120ms; --t-fast:180ms; --t-base:320ms; --t-move:520ms; --t-scene:700ms; --stagger:50ms;
  --e-out:cubic-bezier(.22,1,.36,1); --e-inout:cubic-bezier(.65,0,.35,1); --e-back:cubic-bezier(.34,1.56,.64,1);
}
[hidden]{display:none!important}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{font-family:var(--font);color:var(--ink);background:var(--bg);line-height:1.65;word-break:keep-all;-webkit-font-smoothing:antialiased;font-size:17px}
a{color:inherit}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.wrapup :focus-visible,.codebox :focus-visible,.dock .pres:focus-visible{outline-color:#fff;outline-offset:-4px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 28px}

/* ---------- 상단 바 ---------- */
.top{position:sticky;top:0;z-index:40;background:rgba(247,244,234,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:72px}
.brand{display:flex;align-items:center;gap:12px;font-size:16px;color:var(--sub);text-decoration:none}
.mark{width:32px;height:32px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.pill{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:11px 22px;font-weight:500;font-size:15px;text-decoration:none;transition:transform var(--t-press) var(--e-out),background var(--t-fast),box-shadow var(--t-fast)}
.pill:active{transform:scale(.97)}
.pill-dark{background:var(--ink);color:#fff}
.pill-dark:hover{background:#000}
/* 검은 알약 버튼 오른쪽 끝의 라임 원 + ↗ (바깥 반지름 = 안쪽 반지름 + 여백) */
a.pill-dark:has(.go){padding:6px 6px 6px 22px;gap:14px}
.pill .go{flex:none;width:32px;height:32px;border-radius:50%;background:var(--lime);color:var(--ink);display:grid;place-items:center;transition:transform var(--t-fast) var(--e-out)}
.pill .go svg{width:14px;height:14px}
@media (hover:hover){a.pill-dark:hover .go{transform:rotate(45deg)}}
.pill-light{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.pill-light:hover{box-shadow:0 0 0 1px rgba(20,22,27,.22)}
.hl{background:var(--lime);color:var(--ink);padding:0 .18em;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.num{font:500 13px var(--mono);letter-spacing:.14em;color:var(--sub);margin-bottom:14px}
.kbd{font:500 12px var(--mono);opacity:.6;border:1px solid currentColor;border-radius:5px;padding:0 5px}

/* ---------- 섹션 공통 ---------- */
.sec{padding:120px 0 0}
.sec:first-child{padding-top:70px}
/* 섹션 라벨: 흰 알약 + 왼쪽 작은 검은 점 */
.label{width:fit-content;font-size:14px;color:var(--ink);font-weight:500;margin-bottom:20px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 14px 6px 12px;box-shadow:0 0 0 1px var(--line)}
.label::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--ink);flex:none}
/* 한글 기준 제목: 원본의 굵기 400·자간 -0.045em은 쓰지 않는다 */
h1{font-size:72px;line-height:1.14;font-weight:600;letter-spacing:-.02em}
h2{font-size:54px;line-height:1.22;font-weight:700;letter-spacing:-.025em;max-width:1100px}
h3{font-size:22px;font-weight:600;letter-spacing:-.01em}
.tone{color:var(--sub)}
.tone b{color:var(--ink);font-weight:inherit}
.lead{font-size:23px;color:var(--sub);max-width:640px;margin-top:18px}
.prose{font-size:23px;color:#2A2C33;max-width:720px}
.prose p+p,.prose p+ul,.prose ul+p{margin-top:14px}
.prose strong,.hl-strong strong{color:var(--ink);font-weight:600;background:var(--lime);padding:0 .18em;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.prose code,.inline-code{font:500 .9em var(--mono);background:rgba(18,18,24,.06);padding:1px 6px;border-radius:6px}
.dots{list-style:none;display:grid;gap:10px}
.dots li{position:relative;padding-left:20px;color:var(--sub)}
.dots li::before{content:"";position:absolute;left:3px;top:.68em;width:6px;height:6px;border-radius:50%;background:#C9CBD1}
.prose ul{list-style:none;display:grid;gap:8px}
.prose ul li{position:relative;padding-left:20px}
.prose ul li::before{content:"";position:absolute;left:3px;top:.7em;width:6px;height:6px;border-radius:50%;background:#C9CBD1}

/* ---------- 카드 ---------- */
.card{position:relative;background:var(--card);border-radius:var(--r);box-shadow:0 0 0 1px var(--line);overflow:hidden}
.card .ghost{position:absolute;right:-6px;top:-10px;font-size:110px;line-height:1;opacity:.13;filter:saturate(.6);pointer-events:none;user-select:none}
.grid{display:grid;gap:24px;margin-top:44px}
.g2{grid-template-columns:repeat(2,1fr)} .g3{grid-template-columns:repeat(3,1fr)}
.small{font-size:14px;color:var(--mute)}

/* cover */
.cover .badge{display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:6px 14px;font-size:15px;box-shadow:0 0 0 1px var(--line);margin-bottom:26px}
.cover .badge em{font-style:normal;font-weight:600;background:var(--lime);color:var(--ink);padding:0 .3em;border-radius:4px}
.cover .row{display:flex;gap:34px;align-items:center;margin-top:36px;flex-wrap:wrap}
.cover .row p{max-width:520px;color:var(--sub);font-size:23px}
.cover .meta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.cover .meta span{font-size:14px;color:var(--sub);background:#fff;border-radius:999px;padding:5px 12px;box-shadow:0 0 0 1px var(--line)}
.media{position:relative;margin-top:56px;aspect-ratio:16/9;border-radius:24px;overflow:hidden;background:#E9E9EC;box-shadow:0 0 0 1px var(--line),0 30px 60px -30px rgba(18,18,24,.35)}
.media img,.media video,.media iframe{width:100%;height:100%;object-fit:cover;border:0}
.media .ph{position:absolute;inset:0;display:grid;place-items:center;background:#ECE9DE;color:var(--mute);font-size:15px}
.play{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;background:#fff;border:0;display:grid;place-items:center;box-shadow:0 12px 30px rgba(0,0,0,.25);transition:transform var(--t-fast) var(--e-out);text-decoration:none;color:var(--ink)}
@media (hover:hover){.play:hover{transform:scale(1.06)}}
.play:active{transform:scale(.96)}
.img-miss{display:grid;place-items:center;aspect-ratio:16/10;background:#EDEDF0;color:var(--mute);font-size:14px;padding:12px;text-align:center;word-break:break-all}
.media .img-miss{position:absolute;inset:0;aspect-ratio:auto}
.errbox{padding:20px 22px;border-radius:16px;background:#FFF1F3;box-shadow:inset 0 0 0 1px rgba(225,29,72,.25);color:#7A1230;max-width:720px}
.errbox p{margin-top:6px;font-size:15px}
.errbox code{display:block;margin-top:8px;font:13px var(--mono);opacity:.8}
.play svg{width:28px;height:28px;margin-left:4px}

/* goals */
.goal{padding:30px 28px 30px;min-height:190px}
.goal .k{font-size:19px;color:var(--mute)}
.goal h3{margin-top:4px;font-size:29px}
.goal p{margin-top:12px;color:var(--sub);font-size:21px}

/* concept */
.concept-body{display:grid;grid-template-columns:1fr;gap:36px;margin-top:34px}
.concept-body.has-img{grid-template-columns:1.1fr .9fr;align-items:start}
.concept-body .fig{border-radius:18px;overflow:hidden;box-shadow:0 0 0 1px var(--line);background:#fff}
.concept-body .fig figcaption{font-size:14px;color:var(--mute);padding:10px 14px}
.callout{margin-top:30px;padding:22px 26px;border-radius:18px;background:var(--panel);color:#fff;font-size:25px;font-weight:500;max-width:820px}
.callout .tone{color:var(--panel-sub)}.callout .tone b{color:#fff}
.callout strong,.wrapup strong,.darkpanel strong{background:var(--lime);color:var(--ink);font-weight:600;padding:0 .18em;border-radius:4px;-webkit-box-decoration-break:clone;box-decoration-break:clone}

/* steps */
.steps{display:grid;gap:14px;margin-top:40px;max-width:860px}
.step{padding:22px 26px}
.step .num{margin-bottom:8px}
.step h3{font-size:25px}
.step p{color:var(--sub);margin-top:4px;font-size:21px}
.step .viz{margin-top:12px}

/* 배열 시각화 (steps, concept 안에서 [5,3,8,1] 표시) */
.arr{display:flex;gap:8px;flex-wrap:wrap}
.arr span{min-width:44px;height:44px;padding:0 10px;border-radius:12px;display:grid;place-items:center;font:700 18px var(--mono);background:#EFECE2;box-shadow:inset 0 0 0 1px var(--line)}
.arr span.hi{background:var(--lime);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.arr span.done{background:var(--ink);color:#fff}

/* code */
.codebox{margin-top:34px;border-radius:18px;overflow:hidden;background:var(--panel);color:#E6E6EA;box-shadow:0 20px 40px -24px rgba(0,0,0,.5);max-width:880px}
.codebar{display:flex;justify-content:space-between;align-items:center;padding:10px 14px 10px 18px;background:#1E2026;font-size:13px;color:var(--panel-sub)}
.codebar button{background:#2A2B35;border:0;color:#E6E6EA;border-radius:8px;padding:5px 12px;font-size:13px}
.codebar button:hover{background:#363744}
pre.code{margin:0;padding:16px 0;overflow:auto;font:15px/1.7 var(--mono);counter-reset:ln}
pre.code .ln{display:block;padding:0 20px 0 0;white-space:pre}
pre.code .ln::before{counter-increment:ln;content:counter(ln);display:inline-block;width:3.2em;padding-right:1em;text-align:right;color:#55576A;user-select:none}
pre.code .ln.mark{background:rgba(220,245,110,.16)}
.t-k{color:#C792EA}.t-s{color:#C3E88D}.t-n{color:#F78C6C}.t-c{color:#6B6E80;font-style:italic}.t-f{color:#82AAFF}
.note{margin-top:18px;color:var(--sub);max-width:760px}

/* compare */
.cmp{padding:28px}
.cmp h3{font-size:22px}
.cmp .dots{margin-top:16px}

/* reveal */
.reveal-list{display:grid;gap:14px;margin-top:40px;max-width:860px}
.rv{padding:24px 26px;cursor:pointer;user-select:none;transition:box-shadow var(--t-fast)}
.rv:hover{box-shadow:0 0 0 1px rgba(20,22,27,.2)}
.rv .q{font-size:20px;font-weight:600;display:flex;justify-content:space-between;gap:16px}
.rv .q::after{content:"답 보기";flex:none;font-size:13px;font-weight:500;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:3px 10px;height:fit-content}
.rv.shown .q::after{content:"접기"}
/* 높이가 먼저 열리고 글이 80ms 늦게 나타난다. 닫을 때는 글이 먼저 사라진다 */
.rv .a{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--t-base) var(--e-out)}
.rv .a>div{overflow:hidden;color:var(--sub);font-size:17px;opacity:0;visibility:hidden;transition:opacity var(--t-fast),visibility 0s linear var(--t-fast)}
.rv .a>div>:first-child{margin-top:12px}
.rv.shown .a{grid-template-rows:1fr}
.rv.shown .a>div{opacity:1;visibility:visible;transition:opacity var(--t-base) var(--e-out) 80ms,visibility 0s}

/* quiz */
.quiz{margin-top:40px;max-width:820px;padding:32px}
.qdots{display:flex;gap:8px;margin-bottom:22px;align-items:center}
.qdots i{width:10px;height:10px;border-radius:50%;background:#D9D7CE;transition:background var(--t-base) var(--e-out),box-shadow var(--t-base) var(--e-out)}
.qbody{transition:opacity var(--t-base) var(--e-out),transform var(--t-base) var(--e-out)}
.qbody.pre{opacity:0;transition:none}
.qbody.pre.r{transform:translateX(14px)} .qbody.pre.l{transform:translateX(-14px)}
.qdots i.cur{background:var(--lime);box-shadow:0 0 0 1.5px var(--ink)} .qdots i.done{background:var(--ink)}
.quiz .qn{font-size:14px;color:var(--mute)}
.quiz .qq{font-size:22px;font-weight:600;margin-top:4px}
.opts{display:grid;gap:10px;margin-top:20px}
.opt{text-align:left;background:var(--bg);border:0;border-radius:14px;padding:14px 18px;font-size:17px;box-shadow:inset 0 0 0 1px var(--line);transition:background var(--t-fast),box-shadow var(--t-fast),transform var(--t-press) var(--e-out);display:flex;gap:12px;align-items:center}
.opt:hover:not([disabled]){background:#EFECE2}
.opt:active:not([disabled]){transform:scale(.985)}
.opt.just .mk{animation:pop var(--t-base) var(--e-back)}
@keyframes pop{from{transform:scale(.5)}}
.opt .mk{flex:none;width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;box-shadow:inset 0 0 0 1px var(--line)}
.opt.ok{background:var(--lime);color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)} .opt.ok .mk{background:var(--ink);color:var(--lime)}
.opt.bad{background:var(--card);color:var(--sub);box-shadow:inset 0 0 0 2px var(--ink)} .opt.bad .mk{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.opt[disabled]{cursor:default}
.exwrap{display:grid;grid-template-rows:0fr;transition:grid-template-rows var(--t-base) var(--e-out)}
.exwrap.open{grid-template-rows:1fr}
.exwrap>div{overflow:hidden;opacity:0;visibility:hidden;transition:opacity var(--t-fast),visibility 0s linear var(--t-fast)}
.exwrap.open>div{opacity:1;visibility:visible;transition:opacity var(--t-base) var(--e-out) 80ms,visibility 0s}
.explain{margin-top:18px;padding:16px 18px;border-radius:14px;background:var(--bg);color:#2A2C33}
.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;gap:12px}
.score{font-size:48px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.qsum{list-style:none;display:grid;gap:8px;margin-top:20px}
.qsum li{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:12px;background:var(--bg)}
.qsum .num{margin:0;flex:none}
.qsum .qt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#2A2C33}
.qsum .o-ok,.qsum .o-bad{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px}
.qsum .o-ok{background:var(--lime);color:var(--ink)}
.qsum .o-bad{box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink)}
.print-only{display:none}

/* activity */
.act{margin-top:40px;padding:30px 32px;max-width:900px;display:grid;grid-template-columns:1fr auto;gap:34px;align-items:start}
.timer{text-align:center;min-width:200px}
.timer .clock{font:700 56px/1 var(--mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums;transition:color var(--t-fast)}
.timer .clock.warn,.timer .clock.end{background:var(--lime);color:var(--ink);border-radius:12px}
.timer .clock.end{animation:endpulse .6s var(--e-out) 1}
.tbar{height:4px;border-radius:4px;background:var(--rest);margin-top:14px;overflow:hidden}
.tbar i{display:block;height:100%;background:var(--ink);transform-origin:left;transition:transform var(--t-base) var(--e-out)}
.timer.run .tbar i{transition:transform 1s linear}
.timer .btns{display:flex;gap:8px;justify-content:center;margin-top:14px}
@keyframes endpulse{40%{transform:scale(1.07)}}
.tasks{list-style:none;display:grid;gap:10px}
.tasks label{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:17px}
.tasks input{appearance:none;flex:none;width:22px;height:22px;margin-top:3px;border-radius:7px;box-shadow:inset 0 0 0 1.5px #C9CBD1;background:#fff;cursor:pointer;display:grid;place-items:center}
.tasks input:checked{background:var(--ink);box-shadow:none}
.tasks input:checked::after{content:"✓";color:#fff;font-size:14px;font-weight:700}
.tasks input:checked+span{color:var(--mute);text-decoration:line-through}

/* embed */
.embed{margin-top:34px;border-radius:20px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px var(--line),0 24px 50px -30px rgba(18,18,24,.35)}
.embed .bar{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:13px;color:var(--sub);border-bottom:1px solid var(--line)}
.embed .bar a{color:var(--ink);font-weight:500;text-decoration:none}
.embed iframe{display:block;width:100%;border:0;background:#fff}

/* gallery */
.gal{margin-top:36px;position:relative}
.gal .track{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;scrollbar-width:thin}
.gal figure{flex:0 0 min(640px,82%);scroll-snap-align:start;border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px var(--line)}
.gal figure img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top}
.gal figcaption{padding:12px 16px;font-size:15px;color:var(--sub)}
.gal .nav{display:flex;gap:8px;margin-top:12px}
.gal .nav button{width:44px;height:44px;border-radius:50%;border:0;background:#fff;box-shadow:0 0 0 1px var(--line);font-size:18px}

/* links */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:30px}
.filters button{border:0;border-radius:999px;padding:8px 16px;background:#fff;box-shadow:0 0 0 1px var(--line);font-size:14px;color:var(--sub)}
.filters button.on{background:var(--ink);color:#fff;box-shadow:none}
.lk{display:flex;flex-direction:column;text-decoration:none;transition:box-shadow var(--t-fast)}
.lk .open{transition:transform var(--t-fast) var(--e-out)}
@media (hover:hover){
  .lk:hover{box-shadow:0 0 0 1px rgba(20,22,27,.24)}
  .lk:hover .open{transform:translateX(4px)}
}
.lk img{aspect-ratio:16/10;object-fit:cover;object-position:top;border-bottom:1px solid var(--line)}
.lk .b{padding:20px 22px 22px}
.lk .c{font-size:13px;color:var(--mute)}
.lk h3{font-size:19px;margin-top:4px}
.lk p{color:var(--sub);font-size:15px;margin-top:4px}
.lk .open{margin-top:12px;font-size:14px;font-weight:500}
.lk.hide{display:none}

/* wrap */
.wrapup{margin-top:40px;padding:40px;background:var(--panel);color:#fff;border-radius:24px}
.wrapup ol{list-style:none;display:grid;gap:16px;counter-reset:w}
.wrapup li{counter-increment:w;display:flex;gap:16px;font-size:20px;align-items:baseline}
.wrapup li::before{content:counter(w,decimal-leading-zero);font:500 14px var(--mono);letter-spacing:.14em;color:var(--panel-sub)}
.wrapup .btns{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap}
.wrapup .pill-light{box-shadow:none}

/* flow: 진행 흐름 간트 막대. 막대 너비 = 분 비율, 발표 모드에서 지금 단계만 라임 */
.flow{margin-top:40px;max-width:1060px}
.ftimer{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.fclock{font:600 28px/1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em;padding:6px 10px;border-radius:10px;transition:background var(--t-fast),color var(--t-fast)}
.fclock.over{background:var(--lime);color:var(--ink)}
.fclock.end{animation:endpulse .6s var(--e-out) 1}
.ftimer .small{margin-right:6px}
.ftimer .pill{padding:8px 16px;font-size:14px}
.fbars{display:flex;gap:6px}
.fbar{flex:1 1 0;min-width:72px;border-radius:14px;background:var(--rest);color:var(--sub);overflow:hidden;transition:background var(--t-base) var(--e-out),color var(--t-base) var(--e-out)}
.fbar>div{padding:16px 18px;display:flex;flex-direction:column;gap:2px}
.fbar b{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fbar span{font:500 13px var(--mono);letter-spacing:.06em}
.fbar.on{background:var(--lime);color:var(--ink)}

/* dark: 대비 패널 (흰 글씨, 라임은 형광펜으로만) */
.darkpanel{padding:56px 56px 52px;background:var(--panel);color:#fff;border-radius:28px}
.darkpanel .label{background:rgba(255,255,255,.08);color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.14)}
.darkpanel .label::before{background:#fff}
.darkpanel h2{color:#fff}
.darkpanel .tone{color:var(--panel-sub)} .darkpanel .tone b{color:#fff}
.darkpanel .lead{color:var(--panel-sub)}
.darkpanel .prose{color:#E9EAEC;margin-top:22px}
.dpoints{list-style:none;display:grid;gap:24px;margin-top:38px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.dpoints li{padding-top:18px;border-top:1px solid rgba(255,255,255,.16);font-size:25px;line-height:1.5}
.dpoints .num{color:var(--panel-sub);margin-bottom:10px}
.dpoints.two{grid-template-columns:1fr 1fr;gap:28px 40px}
.dpoints.two li{font-size:23px;line-height:1.6}
@media (max-width:900px){.dpoints.two{grid-template-columns:1fr}}
.darkpanel .codebox{background:#1E2026;margin-top:32px;box-shadow:none}
.darkpanel .codebar{background:#25282F}
.darkpanel :focus-visible{outline-color:#fff}

/* ---------- 논문 발표용 추가 (practical-work-seminar) ---------- */
/* 섹션 앞 본문(goals·steps·table·bars 공통) */
.pre-body{margin-top:22px}
/* goals 큰 숫자 카드: 숫자는 검정 그대로, 그라데이션·색 없음 */
.goal.big h3{font-size:54px;line-height:1.1;font-weight:600;letter-spacing:-.025em;font-variant-numeric:tabular-nums;margin-top:6px}
.goal.big p{font-size:22px}
/* table: 크림 카드 안 표. 숫자 열은 오른쪽 정렬, 강조 칸은 라임 형광펜 */
.tbl{margin-top:36px;border-radius:var(--r);background:var(--card);box-shadow:0 0 0 1px var(--line);overflow-x:auto;max-width:1080px}
.tbl table{width:100%;border-collapse:collapse;font-size:22px;line-height:1.5}
.tbl th{text-align:left;font-weight:500;font-size:19px;color:var(--sub);padding:14px 22px;background:#F2EFE4;white-space:nowrap}
.tbl td{padding:15px 22px;border-top:1px solid var(--line);vertical-align:top;color:#2A2C33}
.tbl td.rh{font-weight:600;color:var(--ink);white-space:nowrap}
.tbl td.rh small{display:block;font-weight:500;font-size:19px;color:var(--sub)}
.tbl .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td.n{font:500 17px var(--font);font-variant-numeric:tabular-nums}
.tbl .hl{font-weight:600}
.tbl strong{color:var(--ink);font-weight:600;background:var(--lime);padding:0 .18em;border-radius:4px}
/* bars: 가로 막대. 기본 검정, 강조 막대만 라임(검은 테두리) */
.bars{margin-top:40px;display:grid;gap:20px;max-width:920px}
.bars .bar .bl{display:flex;justify-content:space-between;align-items:baseline;gap:18px;font-size:23px;margin-bottom:8px}
.bars .bar .bl span{color:#2A2C33}
.bars .bar .bl b{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.bars .bar .bl b small{font-weight:500;color:var(--sub);font-size:19px;margin-left:6px}
.bars .tr{height:14px;border-radius:999px;background:var(--rest);overflow:hidden}
.bars .tr i{display:block;height:100%;border-radius:inherit;background:var(--ink)}
.bars .bar.hi .tr i{background:var(--lime);box-shadow:inset 0 0 0 1.5px var(--ink)}
.bars.dense{gap:12px}
.bars.dense .bar .bl{font-size:21px;margin-bottom:5px}
.bars.dense .tr{height:9px}
/* 발표 모드: 막대는 장이 켜질 때 왼쪽에서 자란다(값의 크기를 보여 주는 움직임) */
body.present .sec .tr i{transform-origin:left;transition:transform var(--t-move) var(--e-out)}
body.present .sec:not(.on) .tr i{transform:scaleX(0)}
body.present .sec.on .bar:nth-child(2) .tr i{transition-delay:var(--stagger)}
body.present .sec.on .bar:nth-child(3) .tr i{transition-delay:calc(var(--stagger)*2)}
body.present .sec.on .bar:nth-child(n+4) .tr i{transition-delay:calc(var(--stagger)*3)}
/* 발표 메모: 읽기 모드에서만 보인다(발표 모드·인쇄에서는 숨김) */
.spk{margin-top:30px;max-width:780px;font-size:15px;color:var(--sub);border-top:1px dashed rgba(20,22,27,.18);padding-top:12px}
.spk summary{cursor:pointer;font-size:13px;font-weight:500;color:var(--mute);list-style:none;display:flex;gap:6px;align-items:center;width:fit-content}
.spk summary::-webkit-details-marker{display:none}
.spk summary::before{content:"+";font:600 14px var(--mono)}
.spk[open] summary::before{content:"–"}
.spk p{margin-top:8px;line-height:1.7}
body.present .spk{display:none}
/* cover 그림이 논문 첫 장처럼 잘리면 안 될 때 */
.media.contain{background:#fff}
.media.contain img{object-fit:contain;padding:4%}

/* ---------- 닐슨 개선 (2026-11-23) ---------- */
/* H1 상태: 지금 어느 논문의 몇 번째 장인지. 읽기 모드는 상단 바, 발표 모드는 왼쪽 위 알약 */
.partnow{margin-left:6px;padding-left:12px;border-left:1px solid rgba(20,22,27,.16);color:var(--ink);font-weight:500}
.partchip{position:fixed;left:22px;top:18px;z-index:60;display:none;align-items:center;gap:10px;border:0;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:999px;padding:7px 14px 7px 8px;font-size:14px;color:var(--sub);box-shadow:0 0 0 1px var(--line)}
.partchip b{background:var(--ink);color:#fff;border-radius:999px;padding:2px 10px;font-weight:600;font-size:13px}
.partchip span{font-variant-numeric:tabular-nums}
.partchip:hover{color:var(--ink)}
body.present .partchip:not([hidden]){display:inline-flex}
/* H3·H7 목차 카드를 누르면 그 장으로 이동 */
button.card{font:inherit;color:inherit;text-align:left;border:0;width:100%;cursor:pointer;transition:box-shadow var(--t-fast),transform var(--t-press) var(--e-out)}
button.card:active{transform:scale(.985)}
.golink .go-hint{position:absolute;right:24px;top:26px;font-size:13px;font-weight:500;color:var(--mute);transition:transform var(--t-fast) var(--e-out),color var(--t-fast)}
@media (hover:hover){button.card:hover{box-shadow:0 0 0 1.5px var(--ink)} button.card:hover .go-hint{color:var(--ink);transform:translateX(3px)}}
/* H6 목차를 논문별로 묶는다 */
.ov li.grp{font-size:13px;font-weight:600;color:var(--ink);padding:14px 12px 6px;letter-spacing:.01em}
.ov li.grp:first-child{padding-top:2px}
/* H7 발표 모드 메모 상자(N). 청중 화면에도 보이므로 켤 때 한 번 알린다 */
.notesbox{position:fixed;left:22px;bottom:86px;z-index:62;width:min(560px,calc(100vw - 44px));max-height:40vh;overflow:auto;background:var(--panel);color:#E9EAEC;border-radius:18px;padding:16px 20px;font-size:15px;line-height:1.7;box-shadow:0 20px 40px -20px rgba(0,0,0,.5)}
.notesbox b{display:block;font-size:12px;font-weight:600;color:var(--panel-sub);letter-spacing:.04em;margin-bottom:4px}
.notesbox strong{background:var(--lime);color:var(--ink);padding:0 .18em;border-radius:4px}
.tbl code.inline-code{font-size:.82em}

/* ---------- 논문 3 추가 요소 (2026-11-23) ---------- */
/* goals 8개 = 4열 */
.g4{grid-template-columns:repeat(4,1fr)}
/* steps row: 가로 흐름도. 카드 사이 화살표, 발표 모드에서도 한 줄 */
.steps.row{max-width:none;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:14px}
.steps.row .step{overflow:visible;padding:20px 20px 22px}
.steps.row .step h3{font-size:23px;line-height:1.4}
.steps.row .step p{font-size:20px}
.steps.row .step:not(:last-child)::after{content:"→";position:absolute;right:-13px;top:50%;transform:translateY(-50%);font-size:14px;color:var(--mute);z-index:1}
/* stairs: 오른쪽으로 갈수록 높아지는 계단 */
.steps.stairs{align-items:end}
.steps.stairs .step:nth-child(1){min-height:200px}.steps.stairs .step:nth-child(2){min-height:250px}.steps.stairs .step:nth-child(3){min-height:300px}.steps.stairs .step:nth-child(4){min-height:350px}
/* mapping: 왼쪽 여러 칩 → 오른쪽 검은 알약 (범주 재구성 같은 변환 그림) */
.map{margin-top:40px;display:grid;gap:14px;max-width:1080px}
.map .mrow{display:grid;grid-template-columns:minmax(0,1.25fr) 40px minmax(0,1fr);gap:16px;align-items:center;padding:22px 26px}
.map .from{display:flex;flex-wrap:wrap;gap:8px}
.map .from span{background:#fff;box-shadow:0 0 0 1px var(--line);border-radius:999px;padding:6px 14px;font-size:21px;color:#2A2C33}
.map .from span.new{background:transparent;box-shadow:inset 0 0 0 1.5px rgba(20,22,27,.3);color:var(--sub);border-radius:999px}
.map .arr{font-size:27px;color:var(--mute);text-align:center}
.map .to b{display:inline-block;background:var(--ink);color:#fff;border-radius:999px;padding:8px 18px;font-weight:600;font-size:23px}
.map .to p{margin-top:8px;color:var(--sub);font-size:20px}
/* bars 묶음: 영역 이름 + 합계, 10개 넘으면 2단 */
.bars.grouped{display:block}
.bars.two{column-count:2;column-gap:56px;max-width:1080px}
.bars.three{column-count:3;column-gap:44px;max-width:none}
.bgroup{break-inside:avoid;display:grid;gap:7px;padding-bottom:14px}
.bars.grouped .bar .bl{margin-bottom:3px}
.bars.grouped .tr{height:8px}
.bgh{display:flex;justify-content:space-between;gap:12px;font-size:14px;font-weight:600;color:var(--ink);border-bottom:1px solid rgba(20,22,27,.12);padding-bottom:6px}
.bgh b{font-variant-numeric:tabular-nums}
@media (max-width:900px){.g4{grid-template-columns:1fr 1fr}.steps.row{grid-template-columns:1fr}.steps.row .step::after{display:none}.steps.stairs .step{min-height:0!important}.map .mrow{grid-template-columns:1fr}.map .arr{transform:rotate(90deg);width:24px}.bars.two,.bars.three{column-count:1}}

/* ---------- 남색 테마 (LECTURE.theme = "navy"): 남색·크림 교차, 강조 주황 하나 ---------- */
.theme-navy{--accent:#E07A2E;--font:"Pretendard","Pretendard Variable","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif}
.theme-navy,.theme-navy .sec.tone-light{--bg:#F5F3EE;--card:#FFFFFF;--ink:#1F2A44;--sub:#49546A;--mute:#5F6A80;--rest:#E2DED3;--line:rgba(31,42,68,.12);--panel:#1F2A44;--panel-sub:#CED4DC;--lime:rgba(224,122,46,.24);--th:rgba(31,42,68,.05)}
.theme-navy .sec.tone-dark{--bg:#1F2A44;--card:#2B3853;--ink:#F5F3EE;--sub:#CED4DC;--mute:#A9B2C1;--rest:rgba(245,243,238,.16);--line:rgba(245,243,238,.14);--panel:#2B3853;--panel-sub:#A9B2C1;--lime:rgba(224,122,46,.38);--th:rgba(245,243,238,.06)}
.theme-navy .sec{background:var(--bg);color:var(--ink);padding:96px 0}
.theme-navy .sec:first-child{padding-top:96px}
body.present.theme-navy{background:#F5F3EE}
body.present.theme-navy .sec{background:var(--bg)}
.theme-navy .top{background:rgba(245,243,238,.92)}
.theme-navy footer{margin:60px auto 130px}
.theme-navy .label{background:var(--card);color:var(--ink)}
.theme-navy .label::before{background:var(--accent)}
.theme-navy .prose,.theme-navy .tbl td,.theme-navy .bars .bar .bl span,.theme-navy .map .from span{color:var(--ink)}
.theme-navy .tbl th{background:var(--th)}
.theme-navy .tbl strong,.theme-navy .hl{background:var(--lime);color:var(--ink)}
.theme-navy .bgh{border-bottom-color:var(--line)}
.theme-navy .map .from span{background:var(--card)}
.theme-navy .map .to b{background:var(--ink);color:var(--bg)}
.theme-navy .callout strong,.theme-navy .darkpanel strong{background:transparent;color:var(--accent);padding:0}
.theme-navy .sec.tone-dark .prose strong,.theme-navy .sec.tone-dark .tbl strong{background:transparent;color:var(--accent);padding:0}
.theme-navy .cover .badge,.theme-navy .cover .meta span{background:var(--card)}
.theme-navy .cover .badge em{background:var(--accent);color:#1F2A44}
.theme-navy .pill-dark{background:var(--ink);color:var(--bg)}
.theme-navy .pill .go{background:var(--accent);color:#1F2A44}
.theme-navy .pill-light{background:var(--card);color:var(--ink)}
.theme-navy .bars .bar.hi .tr i{background:var(--accent);box-shadow:none}
.theme-navy .inline-code{background:var(--th)}
.theme-navy .steps.timeline .step::before{background:var(--accent)}
/* H1 진행 막대: 남색 장에서도 보이게 강조색 */
.theme-navy .progress{background:var(--accent)}
/* H2·H6·H10 용어 풀이: 장 아래 작은 사전. 처음 나오는 전문 용어를 그 자리에서 풀어 준다 */
.terms{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line);font-size:19px;line-height:1.55;max-width:1080px}
.terms div{display:flex;gap:8px;max-width:520px}
.terms dt{font-weight:700;color:var(--ink);white-space:nowrap}
.terms dd{color:var(--sub)}
/* H8 설명 없는 카드는 빈 높이를 두지 않는다 */
.goal:not(:has(p)){min-height:0}
/* goals stack: 순서가 뜻인 항목(목적→방법→결과→함의)을 위에서 아래로 한 줄씩 */
.grid.stack{grid-template-columns:1fr;gap:12px;max-width:1080px}
.grid.stack .goal{display:grid;grid-template-columns:52px 200px 1fr;column-gap:24px;align-items:baseline;min-height:0;padding:22px 30px}
.grid.stack .goal .num{grid-column:1;grid-row:1 / span 2;margin:0;font-size:23px;font-weight:600;color:var(--ink)}
.grid.stack .goal .k{grid-column:2;grid-row:1;font-size:18px}
.grid.stack .goal h3{grid-column:2;margin:0;font-size:27px}
.grid.stack .goal p{grid-column:3;grid-row:1 / span 2;margin:0;font-size:22px;color:#2A2C33}
@media (max-width:640px){.grid.stack .goal{grid-template-columns:40px 1fr}.grid.stack .goal p{grid-column:2;grid-row:auto;margin-top:6px}}
/* SVG 아이콘 칸: 크림 바탕 둥근 사각, 선은 글자색 */
.ico{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#EFECE2;color:var(--ink);flex:none}
.ico svg{width:22px;height:22px}
.goal>.ico,.step .ico{margin-bottom:14px}
.grid.stack .goal:has(.ico){grid-template-columns:52px 42px 170px 1fr}
.grid.stack .goal .ico{grid-column:2;grid-row:1 / span 2;align-self:center;margin:0}
.grid.stack .goal:has(.ico) .k,.grid.stack .goal:has(.ico) h3{grid-column:3}
.grid.stack .goal:has(.ico) p{grid-column:4}
.grid.stack .goal:has(.ico) .num{align-self:center}
.grid.stack .goal:has(.ico){align-items:center}
.steps.row .step .ico{margin:2px 0 12px}
.dock .arrow svg{width:18px;height:18px;display:block;margin:0 auto}
@media (max-width:640px){.grid.stack .goal:has(.ico){grid-template-columns:40px 1fr}.grid.stack .goal .ico{grid-column:1;grid-row:auto}.grid.stack .goal:has(.ico) .k,.grid.stack .goal:has(.ico) h3,.grid.stack .goal:has(.ico) p{grid-column:2}}
/* H8 카드가 5개 이상이면 빈 최소 높이 없이 내용만큼 */
.grid.many .goal{min-height:0;padding:24px 26px}
/* 출처: 발표 모드 왼쪽 아래에 작게 */
.srcline{position:fixed;left:24px;bottom:30px;z-index:55;font-size:13px;color:#6C7078;display:none;pointer-events:none}
body.present .srcline:not(:empty){display:block}
.theme-navy .srcline{color:#49546A}
body.present.dark-now .srcline{color:#A9B2C1}
/* 도넛: SVG + 범례 */
.donut{margin-top:36px;display:grid;grid-template-columns:300px 1fr;gap:48px;align-items:center;max-width:980px}
.donut svg{width:300px;height:300px;display:block}
.donut .ctr b{font:600 34px var(--font);fill:var(--ink)}
.donut .lg{list-style:none;display:grid;gap:14px}
.donut .lg li{display:grid;grid-template-columns:18px 1fr auto auto;gap:14px;align-items:center;font-size:23px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.donut .lg i{width:16px;height:16px;border-radius:5px}
.donut .lg b{font-variant-numeric:tabular-nums;font-weight:600;text-align:right;min-width:56px}
.donut .lg small{color:var(--sub);font-size:20px;font-variant-numeric:tabular-nums;min-width:54px;text-align:right}
/* cols: 요인별 열 카드 (문항 목록) */
.cols{margin-top:36px;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:18px;align-items:start}
.cols .col{padding:22px 22px 20px}
.colh{display:flex;align-items:center;gap:10px}
.colh h3{font-size:25px}
.fchip{flex:none;display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:9px;font-weight:700;font-size:15px}
.colead{margin-top:10px;font-size:19px;color:var(--sub);line-height:1.55;padding-bottom:12px;border-bottom:1px solid var(--line)}
.clist{list-style:none;display:grid;gap:8px;margin-top:12px}
.clist li{display:grid;grid-template-columns:34px 1fr;gap:8px;font-size:15px;line-height:1.5;color:var(--ink)}
.clist code{font:600 12px var(--mono);border-radius:6px;padding:3px 0;text-align:center;height:fit-content;margin-top:2px}
/* stat: 큰 숫자 하나 + 막대 */
.statrow{display:grid;grid-template-columns:260px 1fr;gap:48px;align-items:center;margin-top:36px;max-width:1080px}
.statrow .bars{margin-top:0}
.stat b{display:block;font-size:84px;line-height:1;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stat span{display:block;margin-top:12px;color:var(--sub);font-size:21px}
/* timeline: steps row 의 연표 모양 */
.steps.timeline{position:relative;gap:22px}
.steps.timeline::before{content:"";position:absolute;left:0;right:0;top:7px;height:2px;background:var(--line)}
.steps.timeline .step{background:transparent;box-shadow:none!important;border-radius:0;padding:34px 0 0;overflow:visible}
.steps.timeline .step::before{content:"";position:absolute;left:0;top:0;width:16px;height:16px;border-radius:50%;background:var(--ink)}
.steps.timeline .step::after{display:none}
.steps.timeline .num{display:none}
.steps.timeline .step h3{font-size:22px}
.steps.timeline .step p{font-size:19.5px}
@media (max-width:900px){.donut,.statrow{grid-template-columns:1fr}.cols{grid-template-columns:1fr}.steps.timeline::before{display:none}}

footer{margin:120px 0 130px;color:var(--mute);font-size:14px}

/* ---------- 하단 떠 있는 내비 (Brandora 알약) ---------- */
.dock{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;background:rgba(255,255,255,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 0 0 1px var(--line),0 14px 30px -10px rgba(18,18,24,.25)}
.dock button{border:0;background:transparent;border-radius:999px;padding:9px 14px;font-size:15px;color:var(--sub);white-space:nowrap}
.dock button:hover{color:var(--ink)}
.dock .cur{background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line),0 2px 6px rgba(0,0,0,.06);max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.dock .arrow{width:40px;padding:9px 0;font-size:18px}
/* 읽기 모드에서는 상단 "발표 모드" 버튼 하나만. 발표 모드에서는 여기가 "나가기" */
.dock .pres{display:none;background:var(--ink);color:#fff}
body.present .dock .pres{display:inline-block}
.dock .pres:hover{color:#fff;background:#000}
/* 발표 모드: 이 장에 남은 단계 수 */
.fragdots{display:none;gap:5px;padding:0 6px 0 2px;align-items:center}
body.present .fragdots.has{display:flex}
.fragdots i{width:6px;height:6px;border-radius:50%;background:#D5D6DB;transition:background var(--t-fast)}
.fragdots i.on{background:var(--ink)}
.progress{position:fixed;left:0;top:0;height:3px;width:100%;background:var(--ink);z-index:70;transform:scaleX(0);transform-origin:left;transition:transform var(--t-base) var(--e-out)}

/* 잠깐 뜨는 안내 */
.toast{position:fixed;left:50%;bottom:84px;z-index:65;transform:translate(-50%,8px);max-width:calc(100vw - 32px);background:var(--ink);color:#fff;border-radius:14px;padding:10px 16px;font-size:14px;display:flex;gap:16px;align-items:center;white-space:nowrap;pointer-events:none;opacity:0;visibility:hidden;transition:opacity var(--t-fast),transform var(--t-base) var(--e-out),visibility 0s linear var(--t-fast)}
.toast.on{opacity:1;visibility:visible;transform:translate(-50%,0);transition-delay:0s}
.toast .kbd{opacity:.8;margin-right:6px}

/* overview */
.ov{position:fixed;inset:0;z-index:80;background:rgba(18,18,24,.4);display:grid;place-items:center;padding:24px;opacity:0;visibility:hidden;transition:opacity var(--t-fast),visibility 0s linear var(--t-fast)}
.ov.open{opacity:1;visibility:visible;transition-delay:0s}
.ov .panel{background:#fff;border-radius:22px;max-width:720px;width:100%;max-height:80vh;overflow:auto;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.3);transform:translateY(10px);transition:transform var(--t-base) var(--e-out)}
.ov.open .panel{transform:none}
.ov .panel h4{font-size:15px;color:var(--mute);font-weight:500;padding:4px 8px 12px}
.ov ol{list-style:none;display:grid;gap:2px}
.ov li button{width:100%;text-align:left;border:0;background:transparent;border-radius:12px;padding:10px 12px;display:flex;gap:14px;font-size:16px}
.ov li button:hover,.ov li button.on{background:#F2EFE5}
.ov li .n{font:500 13px var(--mono);color:var(--mute);width:24px;padding-top:2px}
.ov li .t{color:var(--mute);font-size:13px;margin-left:auto;padding-top:2px}
.help{font-size:13px;color:var(--mute);padding:14px 8px 4px;display:flex;gap:14px;flex-wrap:wrap}

/* ---------- 발표 모드 ---------- */
body.present{background:#fff;overflow:hidden}

body.present .top,body.present footer{display:none}
body.present main{position:fixed;inset:0}
body.present .sec{position:absolute;inset:0;padding:0!important;display:none;align-items:center;justify-content:center;overflow:hidden}
/* 장 넘김: 나가는 장은 진행 방향으로 8px 밀리며 빨리 사라지고, 들어오는 장은 반대쪽 16px에서 들어온다 */
body.present .sec.on,body.present .sec.pre,body.present .sec.leaving{display:flex}
body.present .sec.on{transition:opacity var(--t-base) var(--e-out),transform var(--t-base) var(--e-out)}
body.present .sec.pre{opacity:0}
body.present .sec.pre.r{transform:translateX(16px)}
body.present .sec.pre.l{transform:translateX(-16px)}
body.present .sec.leaving{opacity:0;pointer-events:none;transition:opacity var(--t-fast) linear,transform var(--t-fast) var(--e-out)}
body.present .sec.leaving.r{transform:translateX(-8px)}
body.present .sec.leaving.l{transform:translateX(8px)}
/* 한 장 = 한 페이지(16:9, 1440×810 논리 크기). 화면에 맞춰 모든 장이 같은 배율로 커지고 남는 곳은 여백 */
body.present .sec>.wrap{position:absolute;left:50%;top:50%;width:1440px;height:810px;max-width:none;margin:0;padding:92px 80px 112px;display:flex;flex-direction:column;transform-origin:center center}
body.present .phead{flex:none}
body.present .pbody{flex:1 1 auto;min-height:0;position:relative}
body.present .pin{transform-origin:top left;display:flow-root}
/* 페이지에서는 표·목록·막대가 페이지 폭을 다 쓴다(읽기 모드의 최대 폭 제한을 푼다). 긴 글(prose·note·lead)은 읽기 폭 유지 */
body.present .pin .tbl,body.present .pin .grid,body.present .pin .map,body.present .pin .bars,body.present .pin .statrow,body.present .pin .terms,body.present .pin .steps,body.present .pin .donut,body.present .pin .cols{max-width:none}
/* 표지와 검은 패널 장은 페이지 가운데 */
body.present .sec-cover .pbody,body.present .sec-dark .pbody{display:flex;align-items:center}
body.present .sec-cover .pin,body.present .sec-dark .pin{flex:1}
body.present{--mute:#6E7179;--sub:#3F4249}
body.present .card{box-shadow:0 0 0 1.5px rgba(20,22,27,.12)}
body.present .frag-step{transition:opacity var(--t-base) var(--e-out),transform var(--t-base) var(--e-out)}
body.present .frag-step:not(.shown){opacity:0;transform:translateY(16px)}
/* 단계가 남아 있는 동안 앞 단계는 물러난다. 마지막 단계가 나오면 전부 돌아온다 */
body.present .frag-step.shown.past{opacity:.6}
body.present .cover.has-media{display:grid;grid-template-columns:1.05fr .95fr;gap:52px;align-items:center}
body.present .cover.has-media h1{font-size:54px}
body.present .cover.has-media .row{flex-direction:column;align-items:flex-start;gap:20px}
body.present .media{margin-top:0;width:100%}
body.present .steps.many{max-width:none;grid-template-columns:1fr 1fr}
body.present .steps.many .step:last-child:nth-child(odd){grid-column:1/-1}
body.present .steps.row{grid-template-columns:repeat(var(--n),minmax(0,1fr))}
body.present .steps.row .step:last-child:nth-child(odd){grid-column:auto}
.sec .wrap{will-change:auto}

/* ---------- 반응형 ---------- */
@media (max-width:900px){
  .g3{grid-template-columns:1fr 1fr}
  .concept-body.has-img{grid-template-columns:1fr}
  .act{grid-template-columns:1fr}
}
@media (max-width:640px){
  body{font-size:16px}
  .wrap{padding:0 20px}
  h1{font-size:44px} h2{font-size:30px}
  .g2,.g3{grid-template-columns:1fr}
  .sec{padding-top:90px}
  .dock .pres,.dock .opt-only{display:none}
  .top .pill-dark{display:none}
  .quiz,.act,.wrapup{padding:24px}
  .step{padding:18px}
  pre.code{font-size:13px}
}
/* 모션 줄이기: 이동과 크기 변화는 끄고, 무엇이 바뀌었는지 보이도록 짧은 페이드만 남긴다 */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-property:opacity,visibility,background-color,color,box-shadow!important;transition-duration:.12s!important;transition-delay:0s!important;animation:none!important}
  html{scroll-behavior:auto}
}

/* ---------- 인쇄 ---------- */
@media print{
  body{background:#fff;font-size:12pt}
  body::before,.spk,.partchip,.notesbox,.top,.dock,.progress,.ov,.toast,.codebar button,.gal .nav,.filters,.timer .btns,.tbar,.qfoot,.quiz.live{display:none!important}
  .sec{padding:0;break-after:page}
  .rv .a{grid-template-rows:1fr}.rv .a>div{opacity:1;visibility:visible}
  .frag-step{opacity:1!important;transform:none!important}
  .print-only{display:block}
  .card{box-shadow:0 0 0 1px #ddd}
  .embed iframe{display:none}
  a{text-decoration:none}
}

/* Presentation text spacing */
body.present .sec>.wrap{padding:72px 65px 116px}body.present .pin .tbl td,body.present .pin .tbl th{padding-top:9px;padding-bottom:9px}
.tbl.analysis-matrix table{font-size:26px;line-height:1.42}
.tbl.analysis-matrix th{font-size:34px;font-weight:700;color:var(--ink)}
.tbl.analysis-matrix td.rh{font-size:29px}
.tbl.analysis-matrix td.rh small{font-size:22px}
.tbl.analysis-matrix th:first-child{width:19%}
.tbl.analysis-matrix th:not(:first-child){width:40.5%}
body.present .pin .analysis-matrix :is(th,td){padding-block:16px}
</style>

const num = k => `<div class="num">${String(k + 1).padStart(2, '0')}</div>`;
const GO = '<span class="go" aria-hidden="true"><svg viewBox="0 0 14 14"><path d="M4 10L10 4M5 4h5v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>';

/* ---------- 텍스트 도우미 ---------- */
// 제목: **강조** 부분만 검정, 나머지 회색. ** 가 없으면 전체 검정.
const tt = s => { s = String(s ?? ''); if (!s.includes('**')) return inline(s); return '<span class="tone">' + inline(s).replace(/<strong>/g,'<b>').replace(/<\/strong>/g,'</b>') + '</span>'; };
// 인라인: **굵게**, `코드`, [5,3,8,1] 배열은 그대로 텍스트
const inline = s => esc(s).replace(/`([^`]+)`/g, '<code class="inline-code">$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/\n/g, '<br>');
// 본문: 빈 줄로 문단, "- " 로 시작하면 목록
const md = s => String(s ?? '').trim().split(/\n\s*\n/).map(block => {
  const lines = block.split('\n');
  if (lines.every(l => /^\s*-\s+/.test(l))) return '<ul>' + lines.map(l => '<li>' + inline(l.replace(/^\s*-\s+/, '')) + '</li>').join('') + '</ul>';
  return '<p>' + inline(block) + '</p>';
}).join('');
// 배열 시각화: viz: { arr:[5,3,8,1], hi:[0,1], done:[3] }
const viz = v => !v ? '' : '<div class="arr">' + v.arr.map((x, i) => `<span class="${(v.hi||[]).includes(i)?'hi':''} ${(v.done||[]).includes(i)?'done':''}">${esc(x)}</span>`).join('') + '</div>';
const headB = (s, i) => head(s, i) + (s.body ? `<div class="prose pre-body">${md(s.body)}</div>` : '');
const head = (s, i) => `${s.label ? `<div class="label">${esc(s.label)}</div>` : ''}${s.title ? `<h2>${tt(s.title)}</h2>` : ''}${s.lead ? `<p class="lead">${inline(s.lead)}</p>` : ''}`;
// 검은 알약은 오른쪽 끝에 라임 원 ↗, 밝은 알약은 바깥 링크일 때만 ↗ 글자
const btn = b => { const ext = /^https?:/.test(b.url || ''), dark = b.style !== 'light';
  return `<a class="pill ${dark ? 'pill-dark' : 'pill-light'}" href="${esc(b.url || '#')}" ${ext ? 'target="_blank" rel="noopener"' : ''}>${esc(b.text)}${dark ? GO : ext ? ' ↗' : ''}</a>`; };

/* ---------- 코드 하이라이트 ---------- */
const KW = {
  python: 'def|return|for|in|range|if|elif|else|while|and|or|not|True|False|None|import|from|as|class|break|continue|pass|lambda|with|try|except|finally|yield|global|is',
  js: 'const|let|var|function|return|for|of|in|if|else|while|true|false|null|undefined|new|class|break|continue|try|catch|finally|await|async|import|export|from|typeof',
};
const BUILTIN = { python: 'print|len|input|int|str|float|list|dict|set|range|sorted|min|max|sum|abs|enumerate|zip', js: 'console|Math|Array|Object|JSON|document|window|parseInt|parseFloat' };
function highlight(code, lang) {
  lang = (lang || '').toLowerCase(); const L2 = lang === 'javascript' ? 'js' : lang;
  const kw = KW[L2], bi = BUILTIN[L2];
  if (!kw) return esc(code);
  const cm = L2 === 'python' ? '#.*$' : '\\/\\/.*$';
  const re = new RegExp(`(${cm})|("(?:\\\\.|[^"\\\\])*"|'(?:\\\\.|[^'\\\\])*'|\`(?:\\\\.|[^\`\\\\])*\`)|\\b(\\d+(?:\\.\\d+)?)\\b|\\b(${kw})\\b|\\b(${bi})\\b`, 'gm');
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    const cls = m[1] ? 't-c' : m[2] ? 't-s' : m[3] ? 't-n' : m[4] ? 't-k' : 't-f';
    out += `<span class="${cls}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(code.slice(last));
}

/* ---------- 흐름(flow) 도우미 ---------- */
// LECTURE.flow 중 이름이 있고 min > 0 인 단계만 쓴다
const flowList = () => (Array.isArray(L.flow) ? L.flow : []).filter(f => f && f.name && +f.min > 0).map(f => ({ name: String(f.name), min: +f.min }));
const FLOW_MS = flowList().reduce((a, f) => a + f.min, 0) * 60000;
// 남은 시간 표시: 남았으면 MM:SS, 넘겼으면 +M:SS
const fmtLeft = ms => {
  if (ms >= 0) { const s = Math.ceil(ms / 1000); return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`; }
  const s = Math.floor(-ms / 1000); return `+${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
};

/* ---------- 코드 박스 (code 섹션과 dark 섹션이 함께 쓴다) ---------- */
// c = { lang, file, code, highlight }. 복사 버튼은 섹션 번호 i 로 원문을 찾는다
function codeBox(c, i) {
  const marks = new Set(c.highlight || []);
  const lines = highlight(c.code.replace(/\s+$/, ''), c.lang).split('\n');
  return `<div class="codebox"><div class="codebar"><span>${esc(c.file || c.lang || 'code')}</span><button data-copy="${i}">복사</button></div>
      <pre class="code">${lines.map((l, k) => `<span class="ln ${marks.has(k + 1) ? 'mark' : ''}">${l || ' '}</span>`).join('')}</pre></div>`;
}

/* ---------- SVG 아이콘 (직접 그린 선 아이콘, 24×24, currentColor) ---------- */
// 항목을 알아보는 데 도움이 되는 곳에만 쓴다(연구 개요의 목적·방법·결과·함의, 과정 단계). 장식용으로 늘리지 않는다

  search: '<circle cx="11" cy="11" r="6.2"/><path d="M15.6 15.6L20 20"/>',
  chart: '<path d="M4 20h16"/><path d="M7.5 16.5v-5M12 16.5V7.5M16.5 16.5v-8.5"/>',
  bulb: '<path d="M9.5 18h5M10.5 21h3"/><path d="M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2v.2h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/>',
  grid: '<rect x="4" y="4" width="6.5" height="6.5" rx="1.3"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.3"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.3"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.3"/>',
  stairs: '<path d="M4 20h5v-5h5v-5h5V5"/>',

  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3M9 21h6"/>',
  replay: '<path d="M4.5 12a7.5 7.5 0 1 0 2.2-5.3"/><path d="M4.5 4.5v4h4"/>',
  chat: '<path d="M5 5h14a1.5 1.5 0 0 1 1.5 1.5v8A1.5 1.5 0 0 1 19 16h-8l-4.5 3.5V16H5a1.5 1.5 0 0 1-1.5-1.5v-8A1.5 1.5 0 0 1 5 5z"/>',
  layers: '<path d="M12 3.5l8.5 4.5L12 12.5 3.5 8z"/><path d="M3.5 12l8.5 4.5 8.5-4.5"/><path d="M3.5 16l8.5 4.5 8.5-4.5"/>',
  pencil: '<path d="M15.5 4.5l4 4L9 19H5v-4z"/><path d="M13.5 6.5l4 4"/>',
  clipboard: '<rect x="5.5" y="4.5" width="13" height="16.5" rx="2"/><path d="M9 4.5v-1h6v1"/><path d="M9 10h6M9 14h6"/>',
  clipcheck: '<rect x="5.5" y="4.5" width="13" height="16.5" rx="2"/><path d="M9 4.5v-1h6v1"/><path d="M9 13l2 2 4-4.5"/>',
  board: '<rect x="3.5" y="4" width="17" height="11.5" rx="1.5"/><path d="M12 15.5V20M8.5 20h7"/>',
  left: '<path d="M14.5 6l-6 6 6 6"/>',
  right: '<path d="M9.5 6l6 6-6 6"/>',
};
const svgOf = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n] || ''}</svg>`;
const ico = n => n && ICON[n] ? `<span class="ico">${svgOf(n)}</span>` : '';

/* ---------- 섹션 렌더러 ---------- */
const R = {
  cover(s, i) {
    const m = s.media || {};
    let media = '';
    if (m.type === 'image') media = `<div class="media ${m.fit === 'contain' ? 'contain' : ''}"><img src="${esc(m.src)}" alt="${esc(m.alt || '')}">${m.href ? `<a class="play" href="${esc(m.href)}" target="_blank" rel="noopener" aria-label="열기"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="currentColor"/></svg></a>` : ''}</div>`;
    else if (m.type === 'youtube') media = `<div class="media" data-yt="${esc(m.id)}"><img src="https://i.ytimg.com/vi/${esc(m.id)}/hqdefault.jpg" alt=""><button class="play" aria-label="재생"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z" fill="currentColor"/></svg></button></div>`;
    else if (m.type === 'video') media = `<div class="media"><video src="${esc(m.src)}" controls preload="metadata" ${m.poster ? `poster="${esc(m.poster)}"` : ''}></video></div>`;
    else if (m.type === 'placeholder') media = `<div class="media"><div class="ph">${esc(m.text || '이미지 또는 영상 자리')}</div></div>`;
    return `<div class="cover ${media ? 'has-media' : ''}"><div class="ctext">
      ${s.badge ? `<div class="badge">${s.badge.em ? `<em>${esc(s.badge.em)}</em>` : ''}${esc(s.badge.text || s.badge)}</div>` : ''}
      <h1>${tt(s.title)}</h1>
      <div class="row">${(s.buttons || []).map(btn).join('')}${s.desc ? `<p>${inline(s.desc)}</p>` : ''}</div>
      ${s.meta ? `<div class="meta">${s.meta.map(x => `<span>${esc(x)}</span>`).join('')}</div>` : ''}
      </div>${media}</div>`;
  },
  goals(s, i) {
    const n = s.items.length;
    return headB(s, i) + `<div class="grid ${s.stack ? 'stack' : n === 8 ? 'g4' : n === 2 || n === 4 ? 'g2' : 'g3'} ${n > 4 ? 'many' : ''}">${s.items.map((g, k) => `
      <${g.go ? `button type="button" data-go="${g.go - 1}" aria-label="${esc(String(g.title).replace(/\*\*/g, ''))}: ${g.go}번 장으로 이동"` : 'div'} class="card goal ${g.go ? 'golink' : ''} ${s.big ? 'big' : ''} ${glow(k, g.glow)}">${g.go ? `<span class="go-hint" aria-hidden="true">${g.go}장 →</span>` : ''}${g.icon ? `<span class="ghost">${g.icon}</span>` : ''}
        ${num(k)}${ico(g.svg)}${g.kicker ? `<div class="k">${esc(g.kicker)}</div>` : ''}<h3>${inline(g.title)}</h3>${g.desc ? `<p>${inline(g.desc)}</p>` : ''}</${g.go ? 'button' : 'div'}>`).join('')}</div>`;
  },
  concept(s, i) {
    const img = s.image ? `<figure class="fig"><img src="${esc(s.image.src)}" alt="${esc(s.image.alt || '')}">${s.image.caption ? `<figcaption>${esc(s.image.caption)}</figcaption>` : ''}</figure>` : '';
    return head(s, i) + `<div class="concept-body ${img ? 'has-img' : ''}"><div class="prose">${md(s.body)}${s.viz ? `<div style="margin-top:20px">${viz(s.viz)}</div>` : ''}</div>${img}</div>` + (s.callout ? `<div class="callout">${tt(s.callout)}</div>` : '');
  },
  steps(s, i) {
    return headB(s, i) + `<div class="steps ${s.row ? 'row' : s.items.length > 3 ? 'many' : ''} ${s.row && s.stairs ? 'stairs' : ''} ${s.row && s.timeline ? 'timeline' : ''}" style="--n:${s.items.length}">${s.items.map((st, k) => `
      <div class="card step frag-step ${glow(k, st.glow)}" data-frag>
        <div>${num(k)}${ico(st.svg)}<h3>${inline(st.title)}</h3>${st.desc ? `<p>${inline(st.desc)}</p>` : ''}${st.viz ? `<div class="viz">${viz(st.viz)}</div>` : ''}</div></div>`).join('')}</div>`;
  },
  code(s, i) {
    return head(s, i) + codeBox(s, i) + (s.note ? `<p class="note">${inline(s.note)}</p>` : '');
  },
  // 진행 흐름: 단계가 바뀌는 곳마다 넣어 "지금 여기" 장 넘김으로 쓴다
  flow(s, i) {
    const F = flowList();
    if (!F.length) return head(s, i) + '<div class="flow"><p class="small">LECTURE.flow에 단계를 적어 주세요. 예: [{ name: "도입", min: 5 }]</p></div>';
    return head(s, i) + `<div class="flow" data-flow="${i}">
      <div class="ftimer"><span class="fclock">${fmtLeft(FLOW_MS)}</span><span class="small">남은 시간</span>
        <button class="pill pill-light" data-ft="start">시작</button><button class="pill pill-light" data-ft="reset">초기화</button></div>
      <div class="fbars">${F.map(f => `<div class="fbar" data-stage="${esc(f.name)}" style="flex-grow:${f.min}"><div><b>${esc(f.name)}</b><span>${f.min}분</span></div></div>`).join('')}</div></div>`;
  },
  // 검은 패널: 핵심 한 줄, 정리, 코드. points 는 발표 모드에서 → 로 하나씩
  dark(s, i) {
    return `<div class="darkpanel">${head(s, i)}${s.body ? `<div class="prose">${md(s.body)}</div>` : ''}
      ${s.points ? `<ol class="dpoints ${s.cols === 2 ? 'two' : ''}">${s.points.map((p, k) => `<li class="frag-step" data-frag>${num(k)}<div>${inline(p)}</div></li>`).join('')}</ol>` : ''}
      ${s.code ? codeBox(s.code, i) : ''}</div>`;
  },
  compare(s, i) {
    const col = (c, k) => `<div class="card cmp ${glow(k, c.glow)}">${c.icon ? `<span class="ghost">${c.icon}</span>` : ''}${num(k ? 1 : 0)}<h3>${inline(c.title)}</h3><ul class="dots">${c.items.map(x => `<li>${inline(x)}</li>`).join('')}</ul></div>`;
    return head(s, i) + `<div class="grid g2">${col(s.left, 0)}${col(s.right, 2)}</div>${s.note ? `<p class="note">${inline(s.note)}</p>` : ''}`;
  },
  reveal(s, i) {
    return head(s, i) + `<div class="reveal-list">${s.items.map((r, k) => `
      <div class="card rv ${glow(k, r.glow)}" data-frag tabindex="0" role="button" aria-expanded="false"><div class="q">${inline(r.q)}</div><div class="a"><div>${md(r.a)}</div></div></div>`).join('')}</div>`;
  },
  quiz(s, i) {
    return head(s, i) + `<div class="card quiz live" data-quiz="${i}"></div>
      <div class="print-only">${s.questions.map((q, k) => `<p style="margin-top:14px"><b>${k + 1}. ${inline(q.q)}</b></p><ol style="margin-left:22px">${q.options.map((o, j) => `<li>${inline(o)}${j === q.answer ? ' ✔' : ''}</li>`).join('')}</ol>${q.explain ? `<p class="small">${inline(q.explain)}</p>` : ''}`).join('')}</div>`;
  },
  activity(s, i) {
    const done = store.get('act' + i, []);
    return head(s, i) + `<div class="card act">
      <ul class="tasks">${s.tasks.map((t, k) => `<li><label><input type="checkbox" data-act="${i}" data-k="${k}" ${done.includes(k) ? 'checked' : ''}><span>${inline(t)}</span></label></li>`).join('')}</ul>
      ${s.minutes ? `<div class="timer" data-timer="${i}" data-min="${s.minutes}"><div class="clock">${String(s.minutes).padStart(2, '0')}:00</div><div class="tbar" aria-hidden="true"><i></i></div>
        <div class="btns"><button class="pill pill-dark" data-t="start">시작</button><button class="pill pill-light" data-t="reset">초기화</button></div></div>` : ''}
    </div>`;
  },
  embed(s, i) {
    return head(s, i) + `<div class="embed"><div class="bar"><span>${esc(s.src.replace(/^https?:\/\//, ''))}</span><a href="${esc(s.src)}" target="_blank" rel="noopener">새 창에서 열기 ↗</a></div>
      <iframe src="${esc(s.src)}" loading="lazy" style="aspect-ratio:${esc(s.ratio || '16/10')}" title="${esc(s.title || '')}" allow="fullscreen; clipboard-write"></iframe></div>`;
  },
  gallery(s, i) {
    return head(s, i) + `<div class="gal"><div class="track">${s.items.map(g => `<figure><img src="${esc(g.src)}" alt="${esc(g.caption || '')}" loading="lazy">${g.caption ? `<figcaption>${inline(g.caption)}</figcaption>` : ''}</figure>`).join('')}</div>
      ${s.items.length > 1 ? `<div class="nav"><button data-gal="-1" aria-label="이전">‹</button><button data-gal="1" aria-label="다음">›</button></div>` : ''}</div>`;
  },
  links(s, i) {
    const cats = [...new Set(s.items.map(x => x.cat).filter(Boolean))];
    return head(s, i) + (cats.length > 1 ? `<div class="filters" data-filter="${i}"><button class="on" data-f="">전체</button>${cats.map(c => `<button data-f="${esc(c)}">${esc(c)}</button>`).join('')}</div>` : '') +
      `<div class="grid g3" style="margin-top:28px">${s.items.map((x, k) => `
        <a class="card lk ${glow(k, x.glow)}" data-cat="${esc(x.cat || '')}" href="${esc(x.url || '#')}" ${/^https?:/.test(x.url || '') ? 'target="_blank" rel="noopener"' : ''}>
          ${x.img ? `<img src="${esc(x.img)}" alt="" loading="lazy">` : ''}
          <div class="b">${num(k)}${x.cat ? `<div class="c">${esc(x.cat)}</div>` : ''}<h3>${inline(x.title)}</h3>${x.desc ? `<p>${inline(x.desc)}</p>` : ''}<div class="open">열기 ↗</div></div></a>`).join('')}</div>`;
  },
  // 표: head(머리줄), rows(줄), rowHead(첫 칸을 줄 이름으로), mark: [[줄, 칸]] 라임 강조. 숫자만 있는 열은 오른쪽 정렬
  table(s, i) {
    const isNum = v => /^[\s\d.,%|<>=≈~–-]+$/.test(String(v)) && /\d/.test(String(v));
    const cols = s.head.length, numCol = [...Array(cols)].map((_, c) => c > 0 && s.rows.every(r => isNum(r[c])));
    const mk = new Set((s.mark || []).map(([r, c]) => r + ',' + c));
    const cell = (v, r, c) => { const t = inline(v); return mk.has(r + ',' + c) ? `<span class="hl">${t}</span>` : t; };
    return headB(s, i) + `<div class="tbl${s.emphasizeAxes ? ' analysis-matrix' : ''}"><table><thead><tr>${s.head.map((h, c) => `<th scope="col" class="${numCol[c] ? 'n' : ''}">${inline(h)}</th>`).join('')}</tr></thead>
      <tbody>${s.rows.map((row, r) => `<tr>${row.map((v, c) => `<td class="${c === 0 && s.rowHead !== false ? 'rh' : ''} ${numCol[c] ? 'n' : ''}">${cell(v, r, c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`
      + (s.note ? `<p class="note">${inline(s.note)}</p>` : '');
  },
  // 변환 그림: items [{from: [이전 이름들], to: "새 이름", desc}]. from 이 비면 "새로 등장". 발표 모드에서 → 로 한 줄씩
  mapping(s, i) {
    return headB(s, i) + `<div class="map">${s.items.map(m => `<div class="card mrow frag-step" data-frag>
      <div class="from">${(m.from || []).length ? m.from.map(f => `<span>${inline(f)}</span>`).join('') : '<span class="new">새로 등장</span>'}</div>
      <div class="arr" aria-hidden="true">→</div>
      <div class="to"><b${m.color ? ` style="background:${esc(m.color)};color:${esc(m.fg || '#fff')}"` : ''}>${inline(m.to)}</b>${m.desc ? `<p>${inline(m.desc)}</p>` : ''}</div></div>`).join('')}</div>`
      + (s.note ? `<p class="note">${inline(s.note)}</p>` : '');
  },
  // 도넛: items [{label, value, text(비율 표기), color}], center: {value, label}, unit
  donut(s, i) {
    const T = s.items.reduce((a, x) => a + +x.value, 0), R0 = 80, C = 2 * Math.PI * R0, PAL = ['#1F2A44', '#5A6681', '#98A1B3', '#CED4DC', '#E2DED3'];

    if (count) { const el = $('.score b', box); let n = 0; const t = setInterval(() => { if (!el.isConnected || n >= right) return clearInterval(t); el.textContent = ++n; }, 150); }
  }
  // 답을 고르면 화면을 통째로 다시 그리지 않고 바뀐 곳만 고친다: 보기 표시 → 해설 펼침 → 다음 버튼
  function answer(j, viaKb) {
    const q = Q[st.k]; if (!q || st.ans[st.k] !== undefined) return;
    st.ans[st.k] = j; save();
    $$('.opt', box).forEach((b, n) => {
      b.disabled = true;
      if (n === q.answer) { b.classList.add('ok', 'just'); $('.mk', b).textContent = '✓'; }
      else if (n === j) { b.classList.add('bad'); $('.mk', b).textContent = '✕'; }
    });
    $$('.qdots i', box)[st.k].className = dotCls(st.k);
    $('.exwrap', box)?.classList.add('open');
    $('.qhint', box).hidden = true;
    const nx = $('[data-q="next"]', box); nx.hidden = false;
    // 눌린 보기는 비활성이 되므로 초점을 옮긴다. 키보드로 골랐으면 다음 버튼으로, 마우스면 초점을 푼다
    if (viaKb) nx.focus({ preventScroll: true }); else if (box.contains(document.activeElement)) document.activeElement.blur();

  }

    save(); draw(d > 0 ? 1 : -1, d > 0);
    if (viaKb) ($('.opt:not([disabled])', box) || $('[data-q="next"]:not([hidden])', box) || $('[data-q="reset"]', box))?.focus({ preventScroll: true });

    const o = e.target.closest('[data-o]'); if (o) { answer(+o.dataset.o, e.detail === 0); return; }
    const b = e.target.closest('[data-q]'); if (!b) return;
    move(b.dataset.q === 'next' ? 1 : b.dataset.q === 'prev' ? -1 : 0, e.detail === 0);
  });
  box._key = n => { const q = Q[st.k]; if (q && n >= 1 && n <= q.options.length) answer(n - 1, false); };
  // 발표 모드의 → ← : 답한 문제면 다음 문제로, 아니면 false 를 돌려줘 다음 장으로 넘어가게 한다
  box._step = d => {
    if (d > 0 && st.k < Q.length && st.ans[st.k] !== undefined) { move(1, false); return true; }
    if (d < 0 && st.k > 0) { move(-1, false); return true; }
    return false;
  };
  draw();
});

/* ---------- 내비게이션: 읽기 모드 / 발표 모드 ---------- */
let cur = 0, present = false;
const toastEl = $('#toast'); let toastT;
const hideToast = () => { clearTimeout(toastT); toastEl.classList.remove('on'); };
const toast = (html, ms = 2000) => { toastEl.innerHTML = html; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(hideToast, ms); };
const KEYHINT = [['→', '다음'], ['←', '이전'], ['O', '목차'], ['N', '메모'], ['Esc', '나가기']].map(([k, t]) => `<span><span class="kbd">${k}</span>${t}</span>`).join('');
const setCur = i => {
  cur = Math.max(0, Math.min(secs.length - 1, i));
  $('#cur').textContent = `${nameOf(secs[cur], cur)} · ${cur + 1}/${secs.length}`;
  $('#progress').style.transform = `scaleX(${(cur + 1) / secs.length})`;
  $$('#ovList [data-go]').forEach((b, k) => b.classList.toggle('on', k === cur));
  const p = partOf[cur], [pk, pn] = partIdx(cur), pc = $('#partChip'), pw = $('#partNow');
  pc.hidden = !p; pw.hidden = !p;
  if (p) { const [tag, ...rest] = p.split(' · '); pc.innerHTML = `<b>${esc(tag)}</b>${esc(rest.join(' · '))} <span>${pk}/${pn}</span>`; pw.textContent = p; }
  syncNotes();
  document.body.classList.toggle('dark-now', toneOf(secs[cur], cur) === 'dark');
  $('#srcLine').textContent = srcOf[cur] || '';
};
// 출처: source 를 적은 섹션부터 다음 source 전까지 물려받는다(논문별 출처)
const srcOf = []; secs.forEach((x, i) => { srcOf[i] = x.source || (i ? srcOf[i - 1] : '') || L.source || ''; });
// H7 발표 메모: 발표 모드에서 N 으로 켜고 끈다. 읽기 모드에서 N 은 메모 상자를 모두 펼치거나 접는다
let notesOn = false;
function syncNotes() {
  const box = $('#notesBox'); box.hidden = !(present && notesOn);
  if (!box.hidden) box.innerHTML = '<b>발표 메모 · N으로 닫기</b>' + (secs[cur].notes ? inline(secs[cur].notes) : '이 장에는 메모가 없어요.');
}
// 높이가 바뀔 때 크기를 다시 맞춘다. grow(펼쳐지거나 접히는 안쪽 요소)를 주면 다 펼친 높이를 미리 계산해서
// 펼침과 배율이 같은 박자로 함께 움직인다(넘쳤다가 줄어드는 흔들림이 없다). 전환이 끝나면 한 번 더 정확히 맞춘다
function refit(grow, opening) {
  if (!present) return;
  fit(cur, false, grow ? (opening ? grow.scrollHeight - grow.clientHeight : -grow.clientHeight) : 0);
  setTimeout(() => present && fit(cur), T_BASE + 40);
}
const growOf = el => el.classList.contains('rv') ? $('.a>div', el) : null;
const PAGE_W = 1440, PAGE_H = 810;
function fit(i, instant, delta = 0) {
  const w = $('.wrap', secEls[i]); if (!w) return;
  const S = Math.min(innerWidth / PAGE_W, innerHeight / PAGE_H);
  w.style.transform = `translate(-50%, -50%) scale(${S.toFixed(4)})`;
  // 본문이 페이지 아래를 넘으면 본문만 줄인다(제목은 그대로). 줄인 만큼 폭을 넓혀 다시 재고, 몇 번 반복해 맞춘다
  const body = $('.pbody', w), pin = $('.pin', w); if (!body || !pin) return;
  pin.style.transform = 'none'; pin.style.width = '';
  const avail = body.clientHeight, aw = body.clientWidth;
  let b = 1;
  for (let k = 0; k < 5; k++) {
    pin.style.width = (aw / b) + 'px';
    const nb = Math.min(1, avail / Math.max(1, pin.scrollHeight + delta));
    if (Math.abs(nb - b) < 0.004) { b = nb; break; }
    b = nb;
  }
  pin.style.width = b < 1 ? (aw / b) + 'px' : '';
  // 마지막 폭에서 한 번 더 재서, 넘치면 더 줄이기만 한다(폭은 그대로 두므로 가로로도 넘치지 않는다)
  const hf = pin.scrollHeight + delta; if (hf * b > avail) b = avail / hf;
  pin.style.transform = b < 1 ? `scale(${b.toFixed(4)})` : 'none';
  w.dataset.bodyScale = b.toFixed(3); w.dataset.pageScale = S.toFixed(3);
}
// 단계(data-frag) 하나를 보이거나 숨긴다
function fragSet(el, on) { el.classList.toggle('shown', on); if (el.hasAttribute('aria-expanded')) el.setAttribute('aria-expanded', String(on)); }
// 이 장의 단계 상태를 화면에 반영: 앞 단계 물러남 + 하단 내비의 남은 단계 점
function fragState(sec) {
  const fr = $$('[data-frag]', sec), n = fr.filter(el => el.classList.contains('shown')).length;
  const st = fr.filter(el => el.classList.contains('frag-step')), on = st.filter(el => el.classList.contains('shown'));
  st.forEach(el => el.classList.toggle('past', present && on.length < st.length && on.includes(el) && el !== on[on.length - 1]));
  const d = $('#fragDots'); d.classList.toggle('has', present && fr.length > 0);
  if (d.children.length !== fr.length) d.innerHTML = fr.map(() => '<i></i>').join('');
  [...d.children].forEach((x, k) => x.classList.toggle('on', k < n));
  d.setAttribute('aria-label', `이 장의 단계 ${n}/${fr.length}`);
}
function toggleRv(el) { const open = !el.classList.contains('shown'); fragSet(el, open); if (present) fragState(secEls[cur]); refit(growOf(el), open); }
const SLIDE_CLS = ['on', 'pre', 'leaving', 'r', 'l'];
function show(i, dir = 1) {
  const prevEl = secEls.find(s => s.classList.contains('on'));
  setCur(i);
  if (!present) return;
  const next = secEls[cur];
  // 처음 들어올 때 reveal 카드는 닫힌 상태, steps 는 하나도 안 보임 (뒤로 들어오면 전부 보임)
  $$('[data-frag]', next).forEach(el => fragSet(el, dir < 0));
  if (next !== prevEl) {
    secEls.forEach(s => { if (s !== next) { clearTimeout(s._lt); s.classList.remove(...SLIDE_CLS); } });
    if (prevEl) { prevEl.classList.add('leaving', dir > 0 ? 'r' : 'l'); prevEl._lt = setTimeout(() => prevEl.classList.remove('leaving', 'r', 'l'), T_FAST + 40); }
    clearTimeout(next._lt); next.classList.remove(...SLIDE_CLS);
    next.classList.add('pre', dir > 0 ? 'r' : 'l');
    fit(cur, true); void next.offsetWidth;
    next.classList.add('on'); next.classList.remove('pre', 'r', 'l');
  }
  fragState(next);
  flowSync(cur);
  requestAnimationFrame(() => fit(cur, true));
  history.replaceState(null, '', '#p' + (cur + 1));
}
function goTo(i) {
  if (present) show(i, i < cur ? -1 : 1);
  else { secEls[Math.max(0, Math.min(secs.length - 1, i))].scrollIntoView({ behavior: RM ? 'auto' : 'smooth' }); }
}
function step(d) {
  hideToast();
  const edge = () => toast(d > 0 ? '마지막 장이에요' : '첫 장이에요', 1400);
  if (!present) { const to = cur + d; return to < 0 || to >= secs.length ? edge() : goTo(to); }
  const sec = secEls[cur], qz = $('[data-quiz]', sec);
  if (qz && qz._step(d)) return;
  const fr = $$('[data-frag]', sec);
  if (d > 0) { const nx = fr.find(el => !el.classList.contains('shown')); if (nx) { fragSet(nx, true); fragState(sec); refit(growOf(nx), true); return; } if (cur < secs.length - 1) show(cur + 1, 1); else edge(); }
  else { const sh = fr.filter(el => el.classList.contains('shown')); if (sh.length) { const last = sh[sh.length - 1]; fragSet(last, false); fragState(sec); refit(growOf(last), false); return; } if (cur > 0) show(cur - 1, -1); else edge(); }
}
function setPresent(on) {
  if (on && innerWidth < 640) { toast('화면이 좁아서 발표 모드를 켤 수 없어요', 2600); return; }
  present = on; document.body.classList.toggle('present', on);
  $('#presBtn').firstChild.textContent = on ? '발표 종료 ' : '발표 모드 ';
  if (on) {
    show(cur, 1); toast(KEYHINT, 4500);
    // 발표 모드에 들어가면 전체 화면도 켠다. 버튼·키를 누르지 않고(주소 #p5 로) 들어오면 브라우저가 막으므로 안내만
    if (!document.fullscreenElement && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => toast('<span class="kbd">F</span> 를 누르면 전체 화면이 켜져요', 3000));
  }
  else {
    hideToast(); syncNotes();
    secEls.forEach(s => { clearTimeout(s._lt); s.classList.remove(...SLIDE_CLS); const w = $('.wrap', s); if (w) w.style.transform = ''; const p = $('.pin', s); if (p) { p.style.transform = ''; p.style.width = ''; } });
    $$('.frag-step').forEach(el => { el.classList.add('shown'); el.classList.remove('past'); });
    $('#fragDots').classList.remove('has');
    flowSync(cur);
    history.replaceState(null, '', '#s' + (cur + 1)); requestAnimationFrame(() => secEls[cur].scrollIntoView());
    if (document.fullscreenElement) document.exitFullscreen?.();
  }
}
// 목차: 열면 지금 장에 초점, 닫으면 열기 전 자리로 초점을 돌려준다
let ovBack = null;
const ovIsOpen = () => $('#ov').classList.contains('open');
const openOv = () => { ovBack = document.activeElement; $('#ov').classList.add('open'); ($('#ovList .on') || $('#ovList button'))?.focus(); };
const closeOv = () => { if (!ovIsOpen()) return; $('#ov').classList.remove('open'); if (ovBack && ovBack !== document.body) ovBack.focus?.({ preventScroll: true }); ovBack = null; };

// 마우스로 누른 뒤 초점이 버튼에 남으면 스페이스가 그 버튼을 다시 누른다. 마우스 클릭이면 초점을 푼다
const unstick = e => { if (e.detail) e.currentTarget.blur(); };
$('#prev').onclick = e => { unstick(e); step(-1); };
$('#next').onclick = e => { unstick(e); step(1); };
$('#partChip').onclick = e => { unstick(e); openOv(); };
$('#cur').onclick = e => { unstick(e); ovIsOpen() ? closeOv() : openOv(); };
$('#dockPres').onclick = $('#presBtn').onclick = e => { unstick(e); setPresent(!present); };
addEventListener('resize', () => present && fit(cur, true));
// 브라우저에서 Esc 로 전체 화면을 빠져나오면 발표 모드도 같이 끝낸다(전체 화면이었다가 꺼진 경우만)
let fsWas = false;
document.addEventListener('fullscreenchange', () => { if (document.fullscreenElement) fsWas = true; else { if (fsWas && present) setPresent(false); fsWas = false; } });
addEventListener('beforeprint', () => present && setPresent(false));

document.addEventListener('keydown', e => {
  if (e.defaultPrevented) return;
  const t = e.target.closest ? e.target : document.body;
  // 글자를 넣는 칸에서는 단축키를 끈다. 체크박스와 버튼은 글자 칸이 아니므로 화살표가 그대로 먹는다
  if (t.closest('textarea,select,[contenteditable]') || (t.tagName === 'INPUT' && !/^(checkbox|button|submit)$/.test(t.type))) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const k = e.key;
  if (k === 'o' || k === 'O' || k === 'ㅐ' || k === '?') { ovIsOpen() ? closeOv() : openOv(); return; }
  if (k === 'Escape') { if (ovIsOpen()) closeOv(); else if (present) setPresent(false); return; }
  if (ovIsOpen()) {
    // 목차가 열려 있는 동안 화살표는 목차 안에서만 움직인다 (뒤의 장이 넘어가지 않게)
    if (k === 'ArrowDown' || k === 'ArrowUp') { e.preventDefault(); const bs = $$('#ovList button'), n = bs.indexOf(document.activeElement); bs[Math.max(0, Math.min(bs.length - 1, n + (k === 'ArrowDown' ? 1 : -1)))]?.focus(); }
    return;
  }
  if (k === 'p' || k === 'P' || k === 'ㅔ') { setPresent(!present); return; }
  // F: 발표 모드가 아니면 발표 모드(+전체 화면), 발표 모드인데 전체 화면이 아니면 전체 화면만, 둘 다면 나가기
  if (k === 'f' || k === 'F' || k === 'ㄹ') {
    if (!present) setPresent(true);
    else if (!document.fullscreenElement) Promise.resolve(document.documentElement.requestFullscreen?.()).catch(() => toast('전체 화면을 켤 수 없어요. 브라우저의 F11을 써 보세요', 2600));
    else setPresent(false);
    return;
  }
  if (/^[1-9]$/.test(k)) { const q = $('[data-quiz]', secEls[cur]); if (q && (present || isVisible(q))) { q._key(+k); return; } }
  if (k === 'n' || k === 'N' || k === 'ㅜ') {
    if (!present) { const ds = $$('.spk'), open = !ds.every(d => d.open); ds.forEach(d => d.open = open); toast(open ? '발표 메모를 모두 펼쳤어요' : '발표 메모를 모두 접었어요', 1400); return; }
    notesOn = !notesOn; syncNotes(); if (notesOn) toast('메모는 공유 중인 화면에도 보여요. N으로 닫기', 2200); else hideToast(); return;
  }
  if (!present) return;
  // 버튼이나 체크박스에 초점이 있을 때 Enter/스페이스는 그 버튼의 것이다. 장을 넘기지 않는다
  const onCtl = t.closest('button,a,input,[role="button"]');
  if (['ArrowRight', 'PageDown', ' ', 'Enter'].includes(k)) { if ((k === ' ' || k === 'Enter') && onCtl) return; e.preventDefault(); step(1); }
  else if (['ArrowLeft', 'PageUp', 'Backspace'].includes(k)) { e.preventDefault(); step(-1); }
  else if (k === 'Home') show(0, 1); else if (k === 'End') show(secs.length - 1, -1);
});
const isVisible = el => { const r = el.getBoundingClientRect(); return r.top < innerHeight && r.bottom > 0; };

// 읽기 모드: 스크롤 위치에 따라 현재 섹션 표시
const spy = new IntersectionObserver(es => { if (present) return; es.forEach(en => { if (en.isIntersecting) setCur(+en.target.dataset.i); }); }, { rootMargin: '-45% 0px -50% 0px' });
secEls.forEach(s => spy.observe(s));
$$('.frag-step').forEach(el => el.classList.add('shown'));
setCur(0);

// 주소 해시로 위치 복원: #s3 읽기 모드 3번, #p3 발표 모드 3번
function fromHash() {
  const hm = location.hash.match(/^#([sp])(\d+)$/); if (!hm) return;
  const i = Math.max(1, Math.min(secs.length, +hm[2])) - 1;
  if (hm[1] === 'p') { if (!present) { cur = i; setPresent(true); } else if (i !== cur) show(i, i < cur ? -1 : 1); }
  else { if (present) setPresent(false); cur = i; requestAnimationFrame(() => secEls[i].scrollIntoView()); }
}
addEventListener('hashchange', fromHash);
fromHash();
})();
